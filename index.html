<style>
/* Layout: the town fills the whole screen; light cream UI floats on its edges like paper labels pinned to a model. */
[hidden]{display:none!important;}
:root{
  --paper:#f6eedb; --paper-2:#efe3c8; --card:rgba(252,247,236,.94); --card-solid:#fcf7ec;
  --ink:#5b3e2c; --ink-soft:#8a6a52; --line:#e3d2b2; --line-strong:#d4bd96;
  --lime-deep:#4f8a1e; --leaf-deep:#3d6b17; --lemon:#f2d03f; --lemon-soft:#fbefb4; --lemon-deep:#b98a12; --sage:#7f9a6c; --sage-soft:#e2ebd2; --warn-bg:#fbe9d9; --warn:#a6512a;
  --k-house:#5d8a3c; --k-shop:#d4a91f; --k-industry:#a8673a; --k-service:#3f7a8c; --k-utility:#4f6684;
  --teal:#4f8d85; --butter:#f2d27c; --shadow:0 6px 18px rgba(110,74,44,.14),0 1px 2px rgba(110,74,44,.12);
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-serif:"Cormorant Garamond","Noto Serif JP","Noto Serif SC","Noto Serif KR","Songti SC","Hiragino Mincho ProN",Georgia,serif;
  --f-ui:"Nunito","Hiragino Maru Gothic ProN","Hiragino Sans","PingFang SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK JP","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none;}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#fbf5e7 0%,var(--paper) 55%,#ecdfc3 100%);}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;}
#tint{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:0;transition:background-color 1s linear;}
#paper{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 60%,rgba(140,100,60,.16) 100%);}
#world-ui{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
button{font-family:inherit;color:inherit;cursor:pointer;}
button:focus-visible{outline:2px solid var(--lime-deep);outline-offset:2px;}
.ico{width:18px;height:18px;flex:none;display:block;}

/* ---------- top bar ---------- */
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;pointer-events:none;flex-wrap:wrap;}
#top > *{pointer-events:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 16px 4px 8px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);}
.brand svg{width:34px;height:34px;}
.brand .name{font-family:var(--f-script);font-size:28px;line-height:1;color:var(--ink);padding-top:4px;white-space:nowrap;}
.brand .sub{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-top:1px;white-space:nowrap;}
.stats{display:flex;gap:6px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 13px 0 9px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);
  font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.chip .lbl{font-weight:600;font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase;}
.chip.bump{animation:bump .5s ease;}
@keyframes bump{30%{transform:scale(1.08)}}
.wbar{width:54px;height:6px;border-radius:4px;background:#efe2c8;overflow:hidden;border:1px solid var(--line);}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,#9db489,#7f9a6c);border-radius:4px;transition:width .6s;}
.spacer{flex:1;}
.group{display:flex;align-items:center;gap:2px;padding:3px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);}
.ibtn{width:32px;height:32px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;font-weight:800;font-size:12.5px;}
.ibtn:hover{background:#f3e7cf;}
.ibtn.on{background:var(--lime-deep);color:#fff8ef;}
.clock{display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;font-weight:700;font-size:13px;white-space:nowrap;}
.clock svg{width:20px;height:20px;}

/* ---------- goals ---------- */
#goals{position:fixed;top:calc(var(--topH,58px) + 18px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:258px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px 8px;}
#goals h3,.panel h3{margin:0 0 6px;font-family:var(--f-serif);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--ink);}
.goal{display:flex;gap:9px;align-items:flex-start;padding:6px 2px;border-top:1px dashed var(--line);font-size:13px;line-height:1.3;}
.goal:first-of-type{border-top:0;}
.goal .box{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;margin-top:1px;background:#fffaf0;}
.goal.done .box{background:var(--lime-deep);border-color:var(--lime-deep);}
.goal.done .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:rgba(79,138,30,.5);}
.goal .prog{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-left:6px;white-space:nowrap;}
.goal .rw{display:block;font-size:11px;color:var(--sage);font-weight:700;margin-top:1px;}
.goal.flash{animation:flash 1.2s ease;}
@keyframes flash{0%{background:transparent}30%{background:#fde3dc}100%{background:transparent}}

/* ---------- hint ---------- */
#hint{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--catH,170px) + 22px + env(safe-area-inset-bottom,0px));max-width:310px;display:flex;gap:10px;align-items:flex-start;
  background:var(--card-solid);border:1px solid var(--line);border-radius:16px 16px 16px 4px;box-shadow:var(--shadow);padding:10px 12px;font-size:13.5px;line-height:1.4;transition:opacity .4s,transform .4s;}
#hint.hide{opacity:0;transform:translateY(6px);pointer-events:none;}
#hint svg{width:28px;height:28px;flex:none;}
#hint .x{border:0;background:transparent;font-size:11px;font-weight:800;color:var(--ink-soft);padding:2px 4px;margin-left:auto;letter-spacing:.04em;}

/* ---------- catalog ---------- */
#catalog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(1240px,calc(100% - 24px));
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:8px 10px 10px;}
.cat-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tab{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fbf6ea;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tab small{font-size:10px;opacity:.6;letter-spacing:0;}
.tab.on{background:var(--lime-deep);color:#fff8ef;border-color:var(--lime-deep);box-shadow:0 2px 6px rgba(79,138,30,.3);}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--lime-deep);}
.tab.on .dot{background:#fff;}
.tools{margin-left:auto;display:flex;gap:6px;}
.tool{height:30px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--line);background:#fbf6ea;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
.tool.on{background:var(--ink);color:#fbf3e3;border-color:var(--ink);}
.items{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin;}
.item{position:relative;flex:none;width:112px;border:1px solid var(--line);border-radius:14px;background:#fffaf0;padding:6px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,box-shadow .15s,border-color .15s;}
.item:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(110,74,44,.12);}
.item.on{border-color:var(--lemon-deep);box-shadow:0 0 0 3px rgba(242,208,63,.6);}
.item .th{width:100%;height:72px;border-radius:10px;background:radial-gradient(circle at 50% 60%,#f6ead2 0%,#f1e3c6 60%,#ecdcbc 100%);display:grid;place-items:center;overflow:hidden;}
.item .th img{width:84px;height:84px;object-fit:contain;margin-top:-4px;}
.item .nm{font-family:var(--f-serif);font-weight:700;font-size:14.5px;line-height:1.1;text-align:center;min-height:32px;display:flex;align-items:center;}
.item .pr{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;}
.item .pr svg{width:14px;height:14px;}
.item.locked{opacity:.6;}
.item.locked .th img{filter:grayscale(.85) sepia(.3);opacity:.6;}
.item.poor .pr{color:var(--warn);}
.item .badge{position:absolute;top:4px;right:4px;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:var(--lime-deep);color:#fff;}
.item .badge.lock{background:#e8dcc4;color:var(--ink-soft);}
.item .badge.uniq{background:var(--butter);color:var(--ink);}
.item.new{animation:glow 1.6s ease-in-out 3;}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(242,210,124,.8)}}

/* ---------- selection panel ---------- */
.panel{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--topH,58px) + 18px + env(safe-area-inset-top,0px));width:272px;background:var(--card-solid);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px 14px 12px;max-height:calc(100% - var(--topH,58px) - var(--catH,170px) - 50px);overflow:auto;}
.panel .ttl{font-family:var(--f-serif);font-size:24px;font-weight:700;line-height:1.05;margin:0 0 2px;}
.panel .kind{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}
.panel .desc{font-size:13px;line-height:1.4;margin:8px 0;}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:6px 9px;border-radius:10px;background:var(--sage-soft);color:#4e6a3e;}
.status.off{background:var(--warn-bg);color:var(--warn);}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0 4px;font-size:13px;}
.kv b{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;}
.rel{margin-top:10px;}
.rel h4{margin:0 0 4px;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}
.rel ul{list-style:none;margin:0;padding:0;font-size:12.5px;}
.rel li{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dotted var(--line);}
.rel li span:last-child{font-weight:800;white-space:nowrap;}
.rel li.inc span:last-child{color:var(--lemon-deep);}
.rel li.well span:last-child{color:#56743f;}
.rel .none{font-size:12px;color:var(--ink-soft);font-style:italic;}
.actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.btn{flex:1;height:34px;border-radius:999px;border:1px solid var(--line-strong);background:#fbf3e3;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;white-space:nowrap;}
.btn:hover{background:#f5e8cf;}
.btn.red{background:var(--warn);border-color:var(--warn);color:#fff8ef;}
.btn.red:hover{background:#8a3f1f;}
.btn.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);}
/* ---------- placement bar ---------- */
.placebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--catH,170px) + 18px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:calc(100vw - 32px);padding:6px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;}
.placebar[hidden]{display:none;}
.pb-seg{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden;}
.pb-seg button{border:0;background:#fffaf0;padding:5px 11px;font-weight:800;display:flex;align-items:center;gap:5px;min-height:32px;}
.pb-seg button.on{background:var(--lime-deep);color:#fff;}
.pb-seg .ico{width:15px;height:15px;}
.pb-group{display:flex;align-items:center;gap:4px;}
.pb-lbl{font-weight:800;color:var(--ink-soft);margin-right:2px;}
.pb-chip{border:1px solid var(--line);background:#fffaf0;border-radius:999px;padding:4px 9px;font-weight:700;min-height:30px;}
.pb-chip.on{background:var(--sage-soft);border-color:var(--sage);color:var(--leaf-deep);}
.pb-ico{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fffaf0;display:grid;place-items:center;}
.pb-ico .ico{width:16px;height:16px;}
.pb-ico[disabled]{opacity:.4;cursor:not-allowed;}
.panel .hint{font-size:12px;color:var(--ink-soft);margin:6px 0 0;}
.kc-road{background:#8a8378;}
.pb-angle{min-width:38px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;}
.pb-ok{border:0;background:var(--lime-deep);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;min-height:34px;}
.pb-no{border:1px solid var(--line-strong);background:#fffaf0;border-radius:50%;width:34px;height:34px;font-weight:800;}
#tip .ok{color:var(--lime-deep);}
@media (max-width:640px){.placebar{gap:5px;padding:5px;font-size:11.5px;}.pb-lbl{display:none;}}
.btn.up{background:var(--lemon-soft);border-color:var(--lemon-deep);color:#6b4d0b;}
.btn.up:hover{background:#f8e391;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.tier{color:var(--lemon-deep);letter-spacing:1px;font-size:12px;}
.upg{margin-top:10px;}
.upg.max{font-size:12px;font-weight:800;color:var(--ink-soft);}
.upg.open{border:1px dashed var(--lemon-deep);border-radius:12px;padding:8px 10px;background:rgba(251,239,180,.35);animation:upg-in .25s ease-out;}
.upg.open h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
.upg em{font-style:normal;} .upg em.better{color:var(--lime-deep);} .upg em.worse{color:var(--warn);}
.upg .bad{color:var(--warn);font-size:12px;font-weight:800;margin:6px 0 0;}
@keyframes upg-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.upg.open{animation:none;}}
.panel .close{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:transparent;font-size:16px;color:var(--ink-soft);}

/* ---------- settings ---------- */
.langs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px;}
.langs button{height:32px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;font-weight:700;font-size:13px;}
.langs button.on{background:var(--lime-deep);border-color:var(--lime-deep);color:#fff;}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;margin:6px 0;}

/* ---------- toasts / floaters ---------- */
#toasts{position:fixed;top:calc(var(--topH,58px) + 18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30;}
.toast{background:var(--card-solid);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:8px 16px;font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center;animation:tin .4s ease both;}
.toast.big{border-radius:18px;padding:10px 20px;font-family:var(--f-serif);font-size:20px;}
.toast.big b{font-family:var(--f-script);font-weight:400;font-size:28px;color:var(--lime-deep);}
.toast.out{animation:tout .5s ease both;}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.floater{position:absolute;left:0;top:0;font-weight:800;font-size:14px;color:#7a5a08;display:flex;align-items:center;gap:3px;white-space:nowrap;
  text-shadow:0 1px 0 #fff8ec,0 0 6px #fff8ec;will-change:transform,opacity;}
.floater svg{width:15px;height:15px;}
.floater.well{color:#4f6e3c;}
.badge3d{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--card-solid);border:1.5px solid var(--lime-deep);display:grid;place-items:center;box-shadow:var(--shadow);}
.badge3d svg{width:14px;height:14px;}
.chipfx{position:absolute;left:0;top:0;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--card-solid);border:1px solid var(--lime-deep);color:var(--leaf-deep);white-space:nowrap;box-shadow:var(--shadow);}
.chipfx.well{border-color:#7f9a6c;color:#4f6e3c;}
#tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--card-solid);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap;z-index:25;}
#tip .bad{color:var(--warn);}
#help{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(var(--catH,170px) + 22px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--ink-soft);font-weight:600;background:rgba(252,247,236,.7);padding:4px 10px;border-radius:999px;}


.chip small{font-size:11px;font-weight:700;color:var(--sage);margin-left:2px;}
.chip small.neg{color:var(--warn);}
.rci{display:flex;align-items:flex-end;gap:5px;height:38px;padding:0 11px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);}
.rci .col{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:800;color:var(--ink-soft);}
.rci .bar{position:relative;width:8px;height:26px;border-radius:3px;background:#f1e7d0;border:1px solid var(--line);overflow:hidden;}
.rci .bar::after{content:"";position:absolute;left:0;right:0;top:12.5px;height:1px;background:var(--line-strong);}
.rci .bar i{position:absolute;left:0;right:0;}
#d-r i{background:var(--k-house);} #d-c i{background:var(--k-shop);} #d-i i{background:var(--k-industry);}
.rci .bar i.neg{opacity:.55;}
.rci:hover{background:#fbf3df;}
#filters{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:-2px 0 8px;}
.flbl{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 2px 0 6px;}
.fchip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:#fffaf0;font-size:12px;font-weight:700;}
.fchip.on{background:var(--lemon);border-color:var(--lemon-deep);color:var(--ink);}
.tab .ico{width:15px;height:15px;}
.item .tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);text-align:center;line-height:1.2;}
.tag.kc-shop,.tag.kc-industry,.tag.kc-service,.tag.kc-utility,.tag.kc-nature,.tag.kc-deco,.tag.kc-road{padding:1px 6px;border-radius:999px;color:#fff;}
.kc-house{background:var(--k-house);} .kc-shop{background:var(--k-shop);} .kc-industry{background:var(--k-industry);} .kc-service{background:var(--k-service);} .kc-utility{background:var(--k-utility);} .kc-nature,.kc-deco{background:var(--sage);} .kc-road{background:#a99a80;}
.tag.kc-shop{color:var(--ink);}
.item .meta{display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.item .meta svg{width:13px;height:13px;}
.item .pr small{font-size:10px;font-weight:700;color:var(--warn);margin-left:4px;}
.items .empty{padding:24px;color:var(--ink-soft);font-style:italic;}
.kdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}

.meter.bad i{background:var(--warn);}
.kv .wide{grid-column:1/-1;font-size:12px;}
.warn{color:var(--warn);font-weight:700;font-size:12px;}
.neg{color:var(--warn)!important;} .pos{color:var(--leaf-deep);}

.dem{margin:4px 0 8px;}
.dem-h{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;}
.dem-h .num{text-align:right;font-variant-numeric:tabular-nums;}
.dk.r{color:var(--k-house);} .dk.c{color:var(--lemon-deep);} .dk.i{color:var(--k-industry);}
.dbar{position:relative;height:8px;border-radius:4px;background:#efe4cb;}
.dbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line-strong);}
.dbar i{position:absolute;top:0;bottom:0;background:var(--lime-deep);border-radius:4px;}
.dbar i.neg{background:var(--warn);}
.dem ul{margin:3px 0 0 100px;padding:0;list-style:none;font-size:12px;color:var(--ink-soft);line-height:1.35;}

table.svc td{padding:3px 0;border-bottom:1px dotted var(--line);}
table.svc td:nth-child(2){text-align:right;padding-right:8px;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
table.svc td:last-child{text-align:right;white-space:nowrap;}
table.svc b{display:inline-block;min-width:34px;}
.chipfx.svc{border-color:var(--k-service);color:var(--k-service);display:flex;align-items:center;gap:2px;}
.chipfx.svc svg{width:12px;height:12px;}
.chipfx.inc{border-color:var(--lemon-deep);color:#7a5a08;}
@media (max-width:820px){ #city{width:calc(100% - 24px);} .rci{padding:0 8px;} }

/* ---------- Limoni, the mascot ---------- */
.mascot{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--catH,170px) + 22px + env(safe-area-inset-bottom,0px));max-width:360px;display:flex;gap:8px;align-items:flex-end;transition:opacity .35s,transform .35s;z-index:12;}
.mascot.hide{opacity:0;transform:translateY(8px);pointer-events:none;}
.mascot .portrait{width:74px;height:80px;flex:none;filter:drop-shadow(0 4px 6px rgba(110,74,44,.18));}
.mascot .portrait svg{width:100%;height:100%;}
.mascot .bubble{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:16px 16px 16px 4px;box-shadow:var(--shadow);padding:9px 30px 10px 12px;font-size:13.5px;line-height:1.4;margin-bottom:14px;}
.mascot .bubble b{display:block;font-family:var(--f-script);font-weight:400;font-size:20px;line-height:1;color:var(--leaf-deep);margin-bottom:2px;}
.mascot .bubble p{margin:0;}
.mascot .x{position:absolute;right:4px;bottom:calc(100% - 30px);width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--ink-soft);font-size:16px;}
.mascot.pop .portrait{animation:limoni-hop .6s ease;}
.mascot.pop .bubble{animation:tin .35s ease both;}
@keyframes limoni-hop{30%{transform:translateY(-8px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.limoni .paw.wave{transform-origin:95px 92px;animation:limoni-wave 1.4s ease-in-out 2;}
@keyframes limoni-wave{50%{transform:rotate(-14deg)}}
.mode-chip{background:var(--lemon);border-color:var(--lemon-deep);color:var(--ink);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px;}

/* ---------- menu layer ---------- */
.menu-layer{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(91,62,44,.28);overflow:auto;}
.menu-layer[data-screen="main_menu"],body.in-menu .menu-layer{background:radial-gradient(ellipse at 30% 40%,#fbf5e4 0%,var(--paper) 55%,#ead9b6 100%);}
body.in-menu #stage,body.in-menu #top,body.in-menu #catalog,body.in-menu #goals,body.in-menu #mascot,body.in-menu #help,body.in-menu #panel,body.in-menu #city,body.in-menu #world-ui,body.in-menu #tip{visibility:hidden;}
.menu-main{display:flex;align-items:center;gap:40px;flex-wrap:wrap;justify-content:center;max-width:980px;width:100%;}
.menu-hero{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:300px;}
.menu-limoni{width:220px;height:238px;filter:drop-shadow(0 10px 16px rgba(110,74,44,.22));animation:limoni-float 5s ease-in-out infinite;}

@keyframes limoni-float{50%{transform:translateY(-6px)}}

.menu-say p{margin:4px 0 0;}
.menu-card{background:var(--card-solid);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 40px rgba(110,74,44,.18),0 2px 4px rgba(110,74,44,.12);padding:26px 26px 20px;width:min(400px,100%);}
.menu-card.small{width:min(420px,100%);}
.menu-title{font-family:var(--f-script);font-weight:400;font-size:56px;line-height:1;margin:0;color:var(--ink);text-align:center;}
.menu-sub{text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft);margin:4px 0 18px;}
.menu-h{font-family:var(--f-serif);font-size:26px;margin:0 0 14px;text-align:center;}
.menu-list{display:flex;flex-direction:column;gap:8px;}
.menu-list.row{flex-direction:row;}
.menu-card.setup{width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;}

.biome{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fffaf0;padding:8px 10px;min-height:86px;}

.biome .sw{display:flex;gap:3px;} .biome .sw i{width:18px;height:10px;border-radius:4px;border:1px solid rgba(91,62,44,.2);}
.setup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0;}
.setup-row input{height:38px;border-radius:12px;border:1px solid var(--line-strong);background:#fffaf0;padding:0 12px;font:inherit;font-weight:800;width:150px;}
.menu-btn.dice{flex:0 0 auto;min-height:38px;width:44px;padding:0;align-items:center;font-size:18px;}
@media (max-width:640px){.biome-grid{grid-template-columns:repeat(2,1fr);}.biome{min-height:0;}.biome small{display:none;}}
.menu-btn{min-height:48px;border-radius:14px;border:1px solid var(--line-strong);background:#fffaf0;font-weight:800;font-size:15px;text-align:left;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;gap:1px;flex:1;transition:transform .12s,background .12s;}
.menu-btn small{font-weight:600;font-size:11.5px;color:var(--ink-soft);}
.menu-btn:hover{background:#fbf1d9;transform:translateX(2px);}
.menu-btn.primary{background:var(--lime-deep);border-color:var(--lime-deep);color:#fffbef;}
.menu-btn.primary small{color:#e8f2d6;}
.menu-btn.danger{background:var(--warn);border-color:var(--warn);color:#fff8ef;}

.menu-langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;}
.menu-langs button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fffaf0;font-weight:700;font-size:13px;}
.menu-langs button.on{background:var(--lemon);border-color:var(--lemon-deep);}
.menu-sec{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);text-align:center;}
.menu-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line);font-weight:700;font-size:14px;}
.menu-toggle{min-width:64px;min-height:34px;border-radius:999px;border:1px solid var(--line-strong);background:#fffaf0;font-weight:800;}
.menu-toggle.on{background:var(--lime-deep);border-color:var(--lime-deep);color:#fffbef;}
.menu-note{font-size:12px;line-height:1.5;color:var(--ink-soft);margin:12px 0 14px;}
.menu-credits{display:flex;gap:14px;align-items:flex-start;font-size:13.5px;line-height:1.55;margin-bottom:16px;}
.menu-credits svg{width:90px;height:98px;flex:none;}
.menu-credits p{margin:0;white-space:pre-line;}
.menu-dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--card-solid);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(60,40,20,.35);padding:22px;z-index:41;}
.menu-dialog p{font-size:14px;line-height:1.5;margin:0 0 16px;text-align:center;}
@media (max-width:820px){ .menu-limoni{width:140px;height:152px;} .menu-main{gap:16px;} .menu-title{font-size:44px;} }
@media (max-width:1180px){#help{display:none;} .tab:not(.on) span{display:none;} .tab{padding:0 9px;}}
@media (max-width:820px){
  .brand .sub,.chip .lbl,#help{display:none;}

  .panel{width:240px;}
  .item{width:96px;} .item .th{height:60px;} .item .th img{width:70px;height:70px;}
  .mascot{max-width:calc(100% - 24px);}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
